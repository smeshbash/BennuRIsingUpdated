<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bennu Rising International Foundation | Lokah Samastha Sukhino Bhavantu</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                blue: '#003F7F',   // Primary
                red: '#D9381E',    // Richer Red for Skeuomorphism
                green: '#4CAF50',  // Solid Green
                beige: '#EFEBE0',  // Darker Beige for better highlights
                light: '#E6E9EF',  // Neumorphic Base
                dark: '#1F2937',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
            },
            boxShadow: {
              'skeuo-raised': '8px 8px 16px #bebebe, -8px -8px 16px #ffffff',
              'skeuo-sm': '4px 4px 8px #bebebe, -4px -4px 8px #ffffff',
              'skeuo-pressed': 'inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff',
              'skeuo-input': 'inset 3px 3px 6px #cfcfcf, inset -3px -3px 6px #ffffff',
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
            },
            animation: {
              'marquee': 'marquee 40s linear infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0%)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Great+Vibes&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        /* Defensive safety net: the page normally fits with only a small margin
           to spare (a few px), and some browsers (e.g. Opera GX, which reserves
           horizontal space for its sidebar) end up with slightly less usable
           viewport width than others, tipping otherwise-clipped wide elements
           (like the testimonials marquee) into producing a horizontal
           scrollbar. Nothing meaningful ever needs horizontal scroll on this
           site, so hiding overflow-x here is safe and prevents this kind of
           cross-browser rounding difference from ever surfacing as a bug. */
        overflow-x: hidden;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #E6E9EF; /* Base for Neumorphism */
      }
      .font-serif-heading {
        font-family: 'Merriweather', serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #E6E9EF; 
      }
      ::-webkit-scrollbar-thumb {
        background: #003F7F; 
        border-radius: 5px;
        border: 2px solid #E6E9EF;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D9381E; 
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",

    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.84.0",
    "react-helmet-async": "https://aistudiocdn.com/react-helmet-async@^2.0.5"
  }
}
</script>

</head>
