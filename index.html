    <style>
      html, body {
        /* Defensive safety net: the page normally fits with only a small margin
           to spare (a few px), and some browsers (e.g. Opera GX, which reserves
           horizontal space for its sidebar) end up with slightly less usable
           viewport width than others, tipping otherwise-clipped wide elements
           (like the testimonials marquee) into producing a horizontal
           scrollbar. Nothing meaningful ever needs horizontal scroll on this
           site, so hiding overflow-x here is safe and prevents this kind of
           cross-browser rounding difference from ever surfacing as a bug. */
        overflow-x: hidden;

  <script>
    // Backward-compatibility redirect for links shared before the site
    // switched from HashRouter (#/donate?vid=8) to clean URLs (/donate?vid=8).
    // Anyone who already has an old-style link saved/shared (personalized
    // fundraising links in particular) would otherwise silently land on the
    // homepage with no error and no vid= tracking. This runs before React
    // loads, as a plain synchronous script, so it fires on the very first
    // paint regardless of anything else on the page.
    //
    // Only triggers on "#/..." (an old full-route hash) — never touches
    // in-page anchor links like "#objectives" or Supabase's own
    // "#access_token=..." auth-callback hash, neither of which start with "/".
    (function () {
      if (window.location.hash.indexOf('#/') === 0) {
        var legacyPath = window.location.hash.slice(1); // "/donate?vid=8"
        window.location.replace(window.location.origin + legacyPath);
      }
    })();
  </script>
